  $("featureImage").innerHTML=p.image?'<img src="'+p.image+'" alt="">':p.emoji;
  $("featuredSlide").setAttribute("aria-label","Ver detalles de "+p.name);
  $("slidePosition").textContent=String(featuredIndex+1).padStart(2,"0")+" / "+String(featuredProducts.length).padStart(2,"0");
  const dots=$("carouselDots");dots.innerHTML="";
  featuredProducts.forEach((product,index)=>{
    const dot=document.createElement("button");
    dot.type="button";dot.className="carousel-dot";
    dot.setAttribute("aria-label","Mostrar "+product.name);
    dot.setAttribute("aria-pressed",index===featuredIndex);
    dot.onclick=()=>{featuredIndex=index;renderCarousel();};
    dots.appendChild(dot);
  });
}

function waLink(p){
  const msg="Hola, quiero pedir: "+p.name+" ("+fmt(p.price)+"). ¿Está disponible?";
  return "https://wa.me/qr/MJ4LSEEW56UJN1"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
}
function renderChips(){
  $("chips").innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);
    b.onclick=()=>{cat=c;renderChips();render();};
    $("chips").appendChild(b);
  });
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const [lo,hi]=$("range").value==="all"?[0,1e9]:$("range").value.split("-").map(Number);
  let list=PRODUCTS.filter(p=>(cat==="Todos"||p.cat===cat)&&p.price>=lo&&p.price<=hi&&
    (p.name+" "+p.cat+" "+p.desc).toLowerCase().includes(q));
  const s=$("sort").value;
  if(s==="asc")list.sort((a,b)=>a.price-b.price);
  if(s==="desc")list.sort((a,b)=>b.price-a.price);
  $("count").textContent=list.length+(list.length===1?" producto":" productos");
  const g=$("grid");g.innerHTML="";
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No encontramos productos con esos filtros. Prueba con otra palabra o quita un filtro.</div>';return;}
  list.forEach(p=>{
    const b=document.createElement("button");
    b.className="card";b.style.setProperty("--tint",p.tint);
    b.innerHTML='<div class="pic">'+(p.image?'<img src="'+p.image+'" alt="'+p.name+'" loading="lazy">':p.emoji)+'</div><div class="info"><span class="cat">'+p.cat+'</span><span class="name">'+p.name+'</span>'+(p.tag?'<span class="badge">'+p.tag+'</span>':'')+'<span class="price">'+fmt(p.price)+'</span></div>';
    b.onclick=()=>openProduct(p);
    g.appendChild(b);
  });
}
function openProduct(p){
  $("dpic").innerHTML=p.image?'<img src="'+p.image+'" alt="'+p.name+'">':p.emoji;$("dpic").style.setProperty("--tint",p.tint);
  $("dcat").textContent=p.cat;$("dname").textContent=p.name;$("ddesc").textContent=p.desc;
  $("dspecs").innerHTML=p.specs.map(s=>"<li>"+s+"</li>").join("");
  $("dprice").textContent=fmt(p.price);$("dwa").href=waLink(p);
  $("dlg").showModal();
}
$("closeBtn").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close();});
["previousSlide","nextSlide"].forEach((id,index)=>$(id).addEventListener("click",()=>{
  featuredIndex=(featuredIndex+(index===0?-1:1)+featuredProducts.length)%featuredProducts.length;
  renderCarousel();
}));
$("featuredSlide").onclick=()=>openProduct(featuredProducts[featuredIndex]);
["q","sort","range"].forEach(id=>$(id).addEventListener("input",render));
$("storeName").textContent=CONFIG.storeName;document.title=CONFIG.storeName+" · Catálogo";
$("foot").innerHTML='Pedidos por <a href="https://wa.me/'+CONFIG.whatsapp+'" target="_blank" rel="noopener">WhatsApp</a> · <a href="'+CONFIG.instagram+'" target="_blank" rel="noopener">Instagram</a> · <a href="'+CONFIG.tiktok+'" target="_blank" rel="noopener">TikTok</a>';
renderCarousel();renderChips();render();
</script>
</body>
</html>
